<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Runeforge Empire Alpha 0.6</title><style>*{box-sizing:border-box}body{margin:0;background:#162c30;color:#ffe9b2;font:14px system-ui;overflow:hidden;touch-action:none}header{height:56px;padding:9px;background:#21363a;display:flex;justify-content:space-between;align-items:center}#map{height:calc(100dvh - 265px);min-height:180px;background:#56834e;position:relative}canvas{width:100%;height:100%;display:block}#msg{position:absolute;top:8px;left:8px;background:#1b302dcc;padding:8px;border-radius:8px}#bottom{height:209px;background:#20363c;padding:8px}.tabs{display:flex;gap:5px}.tabs button{flex:1}button{background:#47676a;border:1px solid #b99c67;border-radius:9px;color:#fff2d6;padding:10px;font:inherit}.pad{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}#joy{height:112px;width:112px;border-radius:50%;border:3px solid #9eb2a3;background:#344d56;position:relative;touch-action:none}#nub{width:42px;height:42px;border-radius:50%;background:#e8c888;position:absolute;left:32px;top:32px;pointer-events:none}.actions{display:grid;grid-template-columns:repeat(2,75px);gap:6px}#modal{display:none;position:absolute;z-index:5;inset:65px 12px 215px;background:#1d3234f5;border:2px solid #bfa06c;border-radius:12px;padding:14px;overflow:auto;touch-action:pan-y}#modal button{margin:4px}#notice{color:#b7edb8}#close{float:right}</style><header><b>⚒ Runeforge Empire</b><span id="stats">🪙 100 · ⛏ 0 · ⚔ 0</span></header><div id="map"><canvas id="game"></canvas><div id="msg">Alpha 0.6 · Dra joysticken för att gå</div></div><div id="bottom"><div class="tabs"><button onclick="show('empire')">🏰 Empire</button><button onclick="show('hero')">🛡 Hjälte</button><button onclick="show('settings')">⚙ Settings</button></div><div class="pad"><div id="joy"><div id="nub"></div></div><div class="actions"><button onclick="interact()">A · Prata</button><button onclick="action('mine')">⛏ Bryt</button><button onclick="action('forge')">⚒ Smid</button><button onclick="save()">💾 Spara</button></div></div></div><div id="modal"><button id="close" onclick="hide()">✕</button><div id="content"></div><p id="notice"></p></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let S={x:500,y:400,gold:100,ore:0,swords:0,mine:1,forge:1,manager:false,hp:20,xp:0},vx=0,vy=0,speed=170,mode='joystick',panel='',last=performance.now(),acc=0;try{Object.assign(S,JSON.parse(localStorage.getItem('runeforge_alpha6')||'{}'))}catch(e){}const buildings=[{x:180,y:170,w:150,h:110,n:'Smedja',t:'empire',c:'#ac6544'},{x:690,y:170,w:150,h:110,n:'Gruva',t:'empire',c:'#74848a'},{x:170,y:600,w:150,h:110,n:'Marknad',t:'empire',c:'#b18c44'},{x:690,y:600,w:150,h:110,n:'Gille',t:'hero',c:'#7870a3'}];let ww=1,hh=1;function resize(){ww=canvas.clientWidth;hh=canvas.clientHeight;let d=Math.min(window.devicePixelRatio||1,2);canvas.width=ww*d;canvas.height=hh*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function solid(x,y){return x<20||y<20||x>980||y>850||buildings.some(b=>x>b.x-14&&x<b.x+b.w+14&&y>b.y-14&&y<b.y+b.h+14)}function draw(){ctx.clearRect(0,0,ww,hh);ctx.fillStyle='#56854e';ctx.fillRect(0,0,ww,hh);let sc=Math.max(.6,Math.min(ww/550,hh/470));ctx.save();ctx.translate(ww/2-S.x*sc,hh/2-S.y*sc);ctx.scale(sc,sc);ctx.fillStyle='#c2a270';ctx.fillRect(450,0,100,850);ctx.fillRect(0,380,1000,85);for(let i=0;i<60;i++){let x=(i*173+35)%970,y=(i*247+65)%830;if(x>130&&x<860&&y>110&&y<750)continue;ctx.fillStyle='#325f3b';ctx.fillRect(x-13,y-10,32,34);ctx.fillStyle='#43814b';ctx.fillRect(x-20,y-24,45,27)}for(let b of buildings){ctx.fillStyle='#2e3e3c';ctx.fillRect(b.x+8,b.y+10,b.w,b.h);ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#4a3d40';ctx.fillRect(b.x-8,b.y-22,b.w+16,38);ctx.fillStyle='#d8ae76';ctx.fillRect(b.x+b.w/2-20,b.y+b.h-39,40,39);ctx.textAlign='center';ctx.font='bold 22px system-ui';ctx.fillStyle='#fff2ce';ctx.fillText(b.n,b.x+b.w/2,b.y-32)}ctx.fillStyle='#ab5c45';ctx.fillRect(895,405,35,42);ctx.fillStyle='#fff';ctx.fillText('Goblin',912,390);ctx.fillStyle='#2b496b';ctx.fillRect(S.x-12,S.y-11,24,34);ctx.fillStyle='#f4c78c';ctx.fillRect(S.x-11,S.y-29,22,21);ctx.fillStyle='#553627';ctx.fillRect(S.x-12,S.y-30,24,7);ctx.restore();document.getElementById('stats').textContent='🪙 '+Math.floor(S.gold)+' · ⛏ '+Math.floor(S.ore)+' · ⚔ '+S.swords}function tick(t){let dt=Math.min((t-last)/1000,.05);last=t;if(!panel){let nx=S.x+vx*speed*dt,ny=S.y+vy*speed*dt;if(!solid(nx,S.y))S.x=nx;if(!solid(S.x,ny))S.y=ny}if(S.manager){acc+=dt;if(acc>=2){S.gold+=S.mine;acc=0}}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);function note(x){document.getElementById('msg').textContent=x;document.getElementById('notice').textContent=x}function save(){try{localStorage.setItem('runeforge_alpha6',JSON.stringify(S));note('Sparat!')}catch(e){note('Sparning blockerad i denna visning')}}function show(p){panel=p;document.getElementById('modal').style.display='block';let h=p==='empire'?'<h2>🏰 Empire</h2><p>Gruva nivå '+S.mine+' · Smedja nivå '+S.forge+'</p><button onclick="action(\'mine\')">Bryt malm</button><button onclick="action(\'forge\')">Smid svärd (2 malm)</button><button onclick="action(\'sell\')">Sälj svärd (+35 guld)</button><button onclick="action(\'upmine\')">Uppgradera gruva (50)</button><button onclick="action(\'upforge\')">Uppgradera smedja (70)</button><button onclick="action(\'manager\')">Manager (100)</button>':p==='hero'?'<h2>🛡 Hjälte</h2><p>HP '+S.hp+' · XP '+S.xp+'</p><button onclick="action(\'fight\')">⚔ Slåss mot goblin</button>':'<h2>⚙ Inställningar</h2><button onclick="mode=\'joystick\';note(\'Joystick vald\')">Joystick</button><button onclick="mode=\'drag\';note(\'Dra på kartan vald\')">Dra på kartan</button><button onclick="speed=120">Långsam</button><button onclick="speed=170">Normal</button><button onclick="speed=250">Snabb</button>';document.getElementById('content').innerHTML=h;document.getElementById('notice').textContent=''}function hide(){panel='';document.getElementById('modal').style.display='none'}function action(a){if(a==='mine'){S.ore+=S.mine;note('+'+S.mine+' malm')}if(a==='forge'){if(S.ore>=2){S.ore-=2;S.swords+=S.forge;note('Svärd tillverkat!')}else note('Behöver 2 malm')}if(a==='sell'){if(S.swords){S.swords--;S.gold+=35;note('+35 guld')}else note('Inga svärd')}if(['upmine','upforge','manager'].includes(a)){let cost=a==='upmine'?50:a==='upforge'?70:100;if(S.gold<cost)note('För lite guld');else if(a==='manager'&&S.manager)note('Redan anställd');else{S.gold-=cost;if(a==='upmine')S.mine++;if(a==='upforge')S.forge++;if(a==='manager')S.manager=true;note('Uppgraderat!')}}if(a==='fight'){S.gold+=20;S.xp+=5;S.hp=Math.max(1,S.hp-3);if(S.xp>=20){S.xp=0;S.hp=20}note('Goblin besegrad! +20 guld')}if(panel)show(panel)}function interact(){let b=buildings.find(b=>Math.hypot(S.x-(b.x+b.w/2),S.y-(b.y+b.h/2))<165);if(b)show(b.t);else if(Math.hypot(S.x-910,S.y-425)<110)show('hero');else note('Gå närmare en byggnad')}
let joy=document.getElementById('joy'),nub=document.getElementById('nub'),pointer=null;function stick(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy),f=Math.min(1,m/(r.width*.3));vx=m?dx/m*f:0;vy=m?dy/m*f:0;nub.style.transform='translate('+(vx*r.width*.3)+'px,'+(vy*r.width*.3)+'px)'}joy.addEventListener('pointerdown',e=>{e.preventDefault();pointer=e.pointerId;joy.setPointerCapture(pointer);stick(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===pointer)stick(e)});function stop(e){if(e.pointerId===pointer){pointer=null;vx=vy=0;nub.style.transform=''}}joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);let mapPointer=null;canvas.addEventListener('pointerdown',e=>{if(mode==='drag'){mapPointer=e.pointerId;canvas.setPointerCapture(mapPointer);drag(e)}});canvas.addEventListener('pointermove',e=>{if(e.pointerId===mapPointer)drag(e)});function drag(e){let r=canvas.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy);vx=m?dx/m:0;vy=m?dy/m:0}canvas.addEventListener('pointerup',e=>{if(e.pointerId===mapPointer){mapPointer=null;vx=vy=0}});canvas.addEventListener('pointercancel',()=>{mapPointer=null;vx=vy=0});addEventListener('pagehide',()=>{try{localStorage.setItem('runeforge_alpha6',JSON.stringify(S))}catch(e){}});
</script></html>
