function tick(t){let dt=Math.min((t-last)/1000,.05);last=t;if(!panel){let nx=S.x+vx*speed*dt,ny=S.y+vy*speed*dt;if(!solid(nx,S.y))S.x=nx;if(!solid(S.x,ny))S.y=ny}if(S.manager){acc+=dt;if(acc>=2){S.gold+=S.mine;acc=0}}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);function note(x){document.getElementById('msg').textContent=x;document.getElementById('notice').textContent=x}function save(){try{localStorage.setItem('runeforge_alpha6',JSON.stringify(S));note('Sparat!')}catch(e){note('Sparning blockerad i denna visning')}}function show(p){panel=p;document.getElementById('modal').style.display='block';let h=p==='empire'?'<h2>🏰 Empire</h2><p>Gruva nivå '+S.mine+' · Smedja nivå '+S.forge+'</p><button onclick="action(\'mine\')">Bryt malm</button><button onclick="action(\'forge\')">Smid svärd (2 malm)</button><button onclick="action(\'sell\')">Sälj svärd (+35 guld)</button><button onclick="action(\'upmine\')">Uppgradera gruva (50)</button><button onclick="action(\'upforge\')">Uppgradera smedja (70)</button><button onclick="action(\'manager\')">Manager (100)</button>':p==='hero'?'<h2>🛡 Hjälte</h2><p>HP '+S.hp+' · XP '+S.xp+'</p><button onclick="action(\'fight\')">⚔ Slåss mot goblin</button>':'<h2>⚙ Inställningar</h2><button onclick="mode=\'joystick\';note(\'Joystick vald\')">Joystick</button><button onclick="mode=\'drag\';note(\'Dra på kartan vald\')">Dra på kartan</button><button onclick="speed=120">Långsam</button><button onclick="speed=170">Normal</button><button onclick="speed=250">Snabb</button>';document.getElementById('content').innerHTML=h;document.getElementById('notice').textContent=''}function hide(){panel='';document.getElementById('modal').style.display='none'}function action(a){if(a==='mine'){S.ore+=S.mine;note('+'+S.mine+' malm')}if(a==='forge'){if(S.ore>=2){S.ore-=2;S.swords+=S.forge;note('Svärd tillverkat!')}else note('Behöver 2 malm')}if(a==='sell'){if(S.swords){S.swords--;S.gold+=35;note('+35 guld')}else note('Inga svärd')}if(['upmine','upforg let joy=document.getElementById('joy'),nub=document.getElementById('nub'),pointer=null;function stick(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy),f=Math.min(1,m/(r.width*.3));vx=m?dx/m*f:0;vy=m?dy/m*f:0;nub.style.transform='translate('+(vx*r.width*.3)+'px,'+(vy*r.width*.3)+'px)'}joy.addEventListener('pointerdown',e=>{e.preventDefault();pointer=e.pointerId;joy.setPointerCapture(pointer);stick(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===pointer){e.preventDefault();stick(e)}});function stop(e){if(e.pointerId===pointer){pointer=null;vx=vy=0;nub.style.transform=''}}joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);joy.addEventListener('lostpointercapture',()=>{pointer=null;vx=vy=0;nub.style.transform='' });let mapPointer=null;canvas.addEventListener('pointerdown',e=>{if(mode==='drag'){mapPointer=e.pointerId;canvas.setPointerCapture(mapPointer);drag(e)}});canvas.addEventListener('pointermove',e=>{if(e.pointerId===mapPointer)drag(e)});function drag(e){let r=canvas.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy);vx=m?dx/m:0;vy=m?dy/m:0}canvas.addEventListener('pointerup',e=>{if(e.pointerId===mapPointer){mapPointer=null;vx=vy=0}});canvas.addEventListener('pointercancel',()=>{mapPointer=null;vx=vy=0});addEventListener('pagehide',()=>{try{localStorage.setItem('runeforge_alpha6',JSON.stringify(S))}catch(e){}});
