name: Engine regression tests
on:
  push:
    branches: [main, "develop/**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test movement and economy
        run: node --test tests/*.test.mjs
