if(S.dungeonX<170&&Math.abs(S.dungeonY-395)<105){S.scene='village';S.x=895;S.y=510;note('Tillbaka i Emberfall');persist();return}
const enemies=[[440,260],[740,470],[530,680]];
for(let i=0;i<3;i++){if(S.dungeonKills>i)continue;let [x,y]=enemies[i];if(Math.hypot(S.dungeonX-x,S.dungeonY-y)<115){newCombat(i);return}}
note('Utforska grottan, hitta gobliner eller återvänd till EXIT');
}
function levelThreshold(){return S.level*20}
function awardXP(x){S.xp+=x;while(S.xp>=levelThreshold()){S.xp-=levelThreshold();S.level++;S.hp=20+(S.level-1)*4;note('Level up! Nivå '+S.level)}}
function questProgress(){return S.quest===0?Math.min(5,S.oreGathered)+'/5 malm':S.quest===1?Math.min(1,S.swordsCrafted)+'/1 svärd':S.quest===2?Math.min(2,S.forestWins)+'/2 gobliner':S.quest===3?Math.min(250,S.totalGold)+'/250 guld':'Klart'}
function questTitle(){return ['Samla 5 järnmalm','Smid ditt första svärd','Besegra 2 gobliner','Tjäna 250 guld totalt','Utforska vidare'][Math.min(S.quest,4)]}
function questDone(){return S.quest===0?S.oreGathered>=5:S.quest===1?(S.swordsCrafted>0||S.heroSword):S.quest===2?S.forestWins>=2:S.quest===3?S.totalGold>=250:false}

function hide(){panel='';document.getElementById('modal').style.display='none';S.combat=null}
function pay(n){if(S.gold<n){note('Du behöver '+n+' guld');return false}S.gold-=n;return true}
function action(a){
if(a==='guide'){show('guide');return}
if(a==='appearance'){show('appearance');return}
if(a==='bestiary'){show('bestiary');return}
if(a.startsWith('style')){S.heroStyle=Math.max(0,Math.min(2,Number(a.slice(5))||0));persist();show('appearance');return}
if(a==='openempire'){show('empire');return}
if(a==='openquests'){show('quests');return}
if(a==='opencontracts'){show('contracts');return}
if(a==='openhero'){show('hero');return}
if(a==='openexpeditions'){show('expeditions');return}
if(a==='leavehouse'){S.scene='village';S.x=500;S.y=550;hide();persist();note('Du lämnar byggnaden');return}
if(a==='mine'){S.ore+=S.mine;S.oreGathered+=S.mine;note('+'+S.mine+' malm')}
else if(a==='wood'){S.wood+=S.woodLevel;note('+'+S.woodLevel+' trä')}
else if(a==='forge'){if(S.ore<2||S.wood<1)note('Behöver 2 malm och 1 trä');else{S.ore-=2;S.wood--;S.swords+=S.forge;S.swordsCrafted+=S.forge;S.forgeMastery++;if(S.forgeMastery%10===0)S.gold+=20;note('Svärd tillverkat!')}}
else if(a==='sell'){if(S.swords){S.swords--;const price=35+Math.floor(S.merchantRep/5)*5;S.gold+=price;S.totalGold+=price;note('+'+price+' guld')}else note('Inga svärd')}
else if(a==='upmine'&&pay(50*S.mine)){S.mine++;note('Gruvan uppgraderad!')}
else if(a==='upmine10'){const cost=Math.round(50*(10*S.mine+45)*.9);if(pay(cost)){S.mine+=10;note('Gruva +10 nivåer!')}}
else if(a==='upwood'&&pay(45*S.woodLevel)){S.woodLevel++;note('Skogsbruk uppgraderat!')}
else if(a==='upforge'&&pay(70*S.forge)){S.forge++;note('Smedjan uppgraderad!')}
else if(a==='manager'){if(S.manager)note('Gruvchef redan anställd');else if(pay(100)){S.manager=true;note('Gruvan automatiserad!')}}
else if(a==='autoforge'){if(S.autoForge)note('Redan automatiserad');else if(pay(150)){S.autoForge=true;note('Smedjan automatiserad!')}}
else if(a==='autosell'){if(S.autoSell)note('Redan automatiserad');else if(pay(175)){S.autoSell=true;note('Marknaden automatiserad!')}}
else if(a==='equip'){if(S.heroSword)note('Svärd redan utrustat');else if(S.swords<1)note('Smid först ett svärd');else{S.swords--;S.heroSword=true;note('Svärd utrustat!')}}
else if(a==='armor'){if(S.heroArmor)note('Rustning redan utrustad');else if(S.ore<5||S.wood<3)note('Behöver 5 malm och 3 trä');else{S.ore-=5;S.wood-=3;S.heroArmor=true;note('Rustning tillverkad!')}}
else if(a==='buypotion'){if(pay(25)){S.potions++;note('Potion köpt')}}
else if(a==='potion'){if(S.potions<1)note('Inga potions');else{S.potions--;S.hp=Math.min(20+(S.level-1)*4,S.hp+12);note('HP återställt')}}
else if(a==='startfight'){newCombat(0,true);return}
else if(a==='flee'){S.combat=null;show('hero');note('Du flydde från striden');persist();return}
else if(a==='attack'||a==='defend'||a==='runestrike'){
if(!S.combat)return;
const c=S.combat,enemy=ENEMIES[c.enemyIndex||0];
c.turn++;
if(a==='attack'){
const damage=Math.max(1,4+S.level+(S.heroSword?5:0)+Math.floor(Math.random()*4)-enemy.defense);
c.hp-=damage;c.message='Du gör '+damage+' skada.';
}else if(a==='runestrike'){
if(!c.skillReady){note('Rune Strike behöver vila en runda');return}
const damage=8+S.level*2+(S.heroSword?4:0);
c.hp-=damage;c.skillReady=false;c.message='Rune Strike! '+damage+' magisk skada.';
}else{c.guard=true;c.message='Du blockerar nästa attack.'}
if(c.hp<=0){
S.forestWins++;S.combatWins++;if(S.scene==='forest'&&c.enemyIndex===3){S.forestWolfDefeated=true;S.forestWolfWins++;S.wood+=6;S.runes+=2;}
if(S.scene==='dungeon'&&!c.training){S.dungeonKills=Math.min(3,S.dungeonKills+1);if(S.dungeonKills===3)S.dungeonRewardPending=true}
const loot=enemy.gold+S.level*3;
S.gold+=loot;S.totalGold+=loot;
if(Math.random()<.4)S.runes++;
awardXP(enemy.xp);
S.combat=null;show('hero');note(enemy.name+' besegrad! +'+loot+' guld, +'+enemy.xp+' XP');persist();return
}
const hit=Math.max(1,enemy.attack+Math.floor(Math.random()*3)-(S.heroArmor?2:0)-(c.guard?5:0));
c.guard=false;S.hp=Math.max(0,S.hp-hit);c.message+=' '+enemy.name+' gör '+hit+' skada.';
if(a==='defend')c.skillReady=true;
if(S.hp<=0){
S.hp=Math.max(5,Math.floor((20+(S.level-1)*4)/2));S.combat=null;show('hero');note('Du besegrades men återhämtade dig i Emberfall');persist();return
}
}
else if(a==='contract'){if(S.swords<S.contractTarget){note('Du behöver '+S.contractTarget+' svärd');return}S.swords-=S.contractTarget;S.gold+=S.contractReward;S.totalGold+=S.contractReward;S.contractsDone++;S.merchantRep++;awardXP(12);S.contractTarget=Math.min(15,3+S.contractsDone);S.contractReward=100+S.contractsDone*45;note('Kontrakt levererat!')}else if(a==='expedition'){if(S.expeditionEnds){note('Expedition pågår redan');return}S.expeditionEnds=Date.now()+60000;note('Hjälten är ute på expedition!')}
else if(a==='expeditionupgrade'){if(pay(120)){S.expeditionTier=Math.min(5,S.expeditionTier+1);note('Expeditionsgille uppgraderat!')}}
else if(a==='claim'){if(!questDone()){note('Uppdraget är inte klart');return}S.quest++;S.gold+=50;S.totalGold+=50;awardXP(10);note('Uppdrag klart! +50 guld, +10 XP')}
else if(a==='joystick'){mode='joystick';note('Joystick vald')}
else if(a==='drag'){mode='drag';note('Dra på kartan vald')}
else if(a==='slow'){speed=120;note('Långsam')}
else if(a==='normal'){speed=170;note('Normal')}
else if(a==='fast'){speed=250;note('Snabb')}
if(panel)show(panel);
persist();
}
function interact(){if(S.scene==='forest'){forestInteract();return}if(S.scene==='interior'){if(S.insideY>660&&Math.abs(S.insideX-500)<140){S.scene='village';S.x=500;S.y=550;note('Du lämnade byggnaden');persist();return}show('house');return}if(S.scene==='dungeon'){dungeonInteract();return}if(S.y>760&&Math.abs(S.x-500)<160){S.scene='forest';S.forestX=500;S.forestY=690;S.forestVisits++;note('Du upptäckte Whisperwood Forest!');persist();return}if(Math.hypot(S.x-915,S.y-425)<135){S.scene='dungeon';S.dungeonX=150;S.dungeonY=380;S.dungeonKills=0;S.dungeonChestClaimed=false;S.dungeonRewardPending=false;note('Goblingrottan: besegra tre gobliner och hitta skattkistan!');persist();return}if(Math.hypot(S.x-380,S.y-565)<95){show('merchant');return}if(Math.hypot(S.x-618,S.y-565)<95){show('guard');return}let b=buildings.find(b=>Math.hypot(S.x-(b.x+b.w/2),S.y-(b.y+b.h/2))<165);if(b){S.houseType=b.n==='Smedja'?'forge':b.n==='Gruva'?'mine':b.n==='Marknad'?'market':'guild';S.scene='interior';S.insideX=500;S.insideY=575;note('Du gick in i '+b.n+'. Tryck A för tjänster, gå söderut till EXIT.');persist()}else if(Math.hypot(S.x-910,S.y-425)<110)show('hero');else note('Gå närmare en byggnad')}

function menuScrollTarget(target){
  const modal=document.getElementById('modal');
  return modal.style.display==='block' && modal.contains(target);
}
document.addEventListener('touchmove',e=>{
  if(!menuScrollTarget(e.target) && e.cancelable)e.preventDefault();
},{capture:true,passive:false});

function syncViewport(){
  const v=window.visualViewport;
  const height=v ? v.height : window.innerHeight;
  document.documentElement.style.setProperty('--game-height',Math.round(height)+'px');
  document.body.style.top=(v ? v.offsetTop : 0)+'px';
  resize();
}
syncViewport();
