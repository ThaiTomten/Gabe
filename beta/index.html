}

}

 S.productionPriority=priority;persist();show('production');return true;
}
function toggleAutoTrade(type){
 const flag=type==='steel'?'autoTradeSteel':'autoTradeRune';
 const cost=type==='steel'?120:200;
 if(!S[flag]&&S.gold<cost){note('Kräver '+cost+' guld');return false}
 if(!S[flag]){S.gold-=cost;S.tradeCosts+=cost;}
 S[flag]=!S[flag];persist();note('Automatisk försäljning '+(S[flag]?'på':'av'));return true;
}
function tradeCycle(){
 let earned=0;
 for(const [flag,key,reserve,price] of [['autoTradeSteel','steelStock','tradeReserveSteel',55],['autoTradeRune','runeGoods','tradeReserveRune',165]]){
  if(!S[flag]||(S[key]||0)<=(S[reserve]||0))continue;
  reconcileCostBasis();const reward=marketReward(price);recordProductSale(type,reward);S[key]--;S.gold+=reward;S.totalGold+=reward;S.productionOrdersDone++;earned+=reward;
 }
 if(earned){S.tradeRevenue+=earned;refreshMarket();persist()}
 return earned;
}

 const capacity=Math.max(1,S.warehouseCapacity),used=warehouseUsed(),pct=Math.min(100,Math.round(100*used/capacity));
 return '<div class="inventory-section"><h3>📊 Produktionsöversikt</h3><p>Lager: '+used+' / '+capacity+' ('+pct+'%)</p>'+
 '<div style="height:14px;background:#947650;border-radius:7px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+(pct>85?'#b96859':'#79a977')+'"></div></div>'+
 '<p>Stål: '+(S.autoSteel?'Automatiskt':'Manuellt')+' · Runor: '+(S.autoRune?'Automatiskt':'Manuellt')+'</p>'+
 '<p>Försäljning: '+(S.autoTradeSteel?'Stål aktivt':'Stål av')+' / '+(S.autoTradeRune?'Runor aktivt':'Runor av')+'</p>'+
 '<p>Automatisk omsättning: '+S.tradeRevenue+' guld · Startinvesteringar: '+S.tradeCosts+' guld</p><p>Produktionsintäkter: '+S.productionRevenueTotal+' guld · Beräknade materialkostnader: '+S.productionCostTotal+' guld</p><p>Beräknat produktionsnetto: '+productionProfit()+' guld</p><small>Materialkostnader är schablonvärden, inte bokförda inköpspriser. Lagerförändringar och andra företag ingår inte.</small></div>';
}
function productionUnitCost(type){
 const v=S.materialValuation||{ore:6,wood:4,runes:18};
 return type==='steel'?3*v.ore+v.wood:type==='rune'?2*v.wood+2*v.runes+3*v.ore+v.wood:0;
}
function productionBasis(type){
 const v=S.materialValuation||{ore:6,wood:4,runes:18};
 if(type==='steel')return 3*v.ore+v.wood;
 const steelBasis=(S.steelCostBasis||[]).length?S.steelCostBasis[0]:productionUnitCost('steel');
 return steelBasis+2*v.wood+2*v.runes;
}
function recordProductionCost(type,basis){
 S.productionCostTotal+=type==='steel'?basis:Math.max(0,basis-(S.materialValuation.ore*3+S.materialValuation.wood));
}
function productionProfit(){return S.productionRevenueTotal-S.productionRealizedCost-S.tradeCosts}
function warehouseCategoryStats(){return {steel:S.steelStock||0,rune:S.runeGoods||0,ward:S.wardSeals||0,free:warehouseSpace(),capacity:S.warehouseCapacity}}
function reconcileCostBasis(){
 for(const [key,queue,cost] of [['steelStock','steelCostBasis',productionUnitCost('steel')],['runeGoods','runeCostBasis',productionUnitCost('rune')]]){
  if(!Array.isArray(S[queue]))S[queue]=[];
  while(S[queue].length<(S[key]||0))S[queue].push(cost);
  if(S[queue].length>(S[key]||0))S[queue].length=S[key]||0;
 }
}
function recordProductSale(type,reward){
 reconcileCostBasis();
 const key=type==='steel'?'steelCostBasis':'runeCostBasis';
 const basis=S[key].shift()||productionUnitCost(type);
 S.productionRealizedCost+=basis;
 S.productionGrossProfit+=reward-basis;
 S.productionRevenueTotal+=reward;
}
const PRODUCTION_RECIPES={
 steel:{name:'Ståltacka',ore:3,wood:1,output:'steelStock',amount:1},
 rune:{name:'Runförstärkt vara',ore:0,wood:2,runes:2,steelStock:1,output:'runeGoods',amount:1}
};
function craftProduction(type){
 const r=PRODUCTION_RECIPES[type];if(!r)return false;
 if(type==='rune'&&!S.arcaneWorkshopBuilt){note('Bygg Runverkstaden först');return false}
 if(type==='steel'&&warehouseSpace()<1){note('Lagret är fullt');return false}
 for(const key of ['ore','wood','runes','steelStock'])if((S[key]||0)<(r[key]||0)){note('Saknar material för '+r.name);return false}
 reconcileCostBasis();const basis=productionBasis(type);
 for(const key of ['ore','wood','runes','steelStock'])S[key]-=r[key]||0;
 if(type==='rune')S.steelCostBasis.shift();
 S[r.output]=(S[r.output]||0)+r.amount;
 (type==='steel'?S.steelCostBasis:S.runeCostBasis).push(basis);
 S.productionCostTotal+=type==='steel'?basis:basis-productionUnitCost('steel');persist();note(r.name+' tillverkad');return true;
}
function sellProduction(type){
 const price=type==='steel'?55:165;
 const key=type==='steel'?'steelStock':'runeGoods';
 if((S[key]||0)<1){note('Lagret är tomt');return false}
 reconcileCostBasis();const reward=marketReward(price);recordProductSale(type,reward);S[key]--;S.gold+=reward;S.totalGold+=reward;S.productionOrdersDone++;refreshMarket();persist();note('Såld vara: +'+reward+' guld');return true;
}
function craftWardSeal(){
 if(!S.arcaneWorkshopBuilt||S.runeGoods<1||S.monsterEssence<3){note('Kräver Runverkstad, 1 runvara och 3 monsteressenser');return false}
 reconcileCostBasis();
 const basis=(S.runeCostBasis.shift()||productionUnitCost('rune'))+3*12;
 S.runeGoods--;S.monsterEssence-=3;S.wardSeals++;S.wardCostBasis.push(basis);
 S.productionCostTotal+=36;persist();note('Väktarsigill tillverkat!');return true;
}
function deliverWardSeal(){
 if(S.wardSeals<1){note('Tillverka ett Väktarsigill först');return false}
 const basis=S.wardCostBasis.shift()||102;
 S.wardSeals--;const reward=marketReward(260);
 S.gold+=reward;S.totalGold+=reward;S.productionRevenueTotal+=reward;
 S.productionRealizedCost+=basis;S.productionGrossProfit+=reward-basis;
 S.wardDeliveries++;S.heroRenown++;S.marketDeliveries++;
 refreshMarket();persist();note('Gillet betalade '+reward+' guld för Väktarsigillet');return true;
}
function deliverProductionQuest(){
 if(S.productionQuestDone>=3){note('Alla runbeställningar är färdiga');return false}
 if(!S.arcaneWorkshopBuilt||S.runeGoods<2||S.forestWolfWins<1){note('Kräver Runverkstad, två runvaror och besegrad Duskwolf');return false}
 reconcileCostBasis();S.runeGoods-=2;S.runeCostBasis.splice(0,2);
 S.productionQuestDone++;S.heroRenown++;S.gold+=230;S.totalGold+=230;persist();
 note('Gillet mottog runvarorna! +230 guld, +1 anseende');return true;
}

function buildAdvanced(type){
 const b=ADVANCED_BUILDINGS[type];if(!b)return false;
 if(!renownUnlocked(b.unlock)){note('För lågt anseende');return false}

 S.gold-=b.gold;S.wood-=b.wood;S.ore-=b.ore;S[b.flag]=true;persist();note(b.label+' byggt!');return true;

function hide(){panel='';document.getElementById('modal').style.display='none';S.combat=null}
function pay(n){if(S.gold<n){note('Du behöver '+n+' guld');return false}S.gold-=n;return true}
function action(a){
if(a==='guide'){show('guide');return}
if(a==='craftward'){craftWardSeal();show('production');return}
if(a==='deliverward'){deliverWardSeal();show('quests');return}
if(a==='deliverproductionquest'){deliverProductionQuest();show('quests');return}
if(a.startsWith('invcat-')){changeInventoryCategory(a.slice(7));return}
if(a==='reservesteelplus'){changeTradeReserve('steel',1);return}
if(a==='reservesteelminus'){changeTradeReserve('steel',-1);return}
if(a==='reserveruneplus'){changeTradeReserve('rune',1);return}
if(a==='reserveruneminus'){changeTradeReserve('rune',-1);return}
if(a.startsWith('priority-')){setProductionPriority(a.slice(9));return}
if(a==='autotradesteel'){toggleAutoTrade('steel');show('production');return}
if(a==='autotraderune'){toggleAutoTrade('rune');show('production');return}
if(a==='upwarehouse'){upgradeWarehouse();show('production');return}
if(a==='autosteel'){automateProduction('steel');show('production');return}
if(a==='autorune'){automateProduction('rune');show('production');return}
if(a==='craftsteel'){craftProduction('steel');show('production');return}
if(a==='craftrune'){craftProduction('rune');show('production');return}
if(a==='sellsteel'){sellProduction('steel');show('production');return}
if(a==='sellrune'){sellProduction('rune');show('production');return}
if(a==='openproduction'){show('production');return}
if(a.startsWith('empireorder-')){deliverEmpireOrder(a.slice(12));show('contracts');return}
if(a==='buildhall'){buildRenownHall();show('quests');return}
if(a==='buildcaravan'){buildAdvanced('caravan');show('quests');return}
if(a==='buildarcane'){buildAdvanced('arcane');show('quests');return}
if(a.startsWith('npcaccept-')){acceptNpcQuest(a.slice(10));show('quests');return}
if(a.startsWith('npccomplete-')){completeNpcQuest(a.slice(12));show('quests');return}
if(a.startsWith('npcclaim-')){claimNpcQuest(a.slice(9));show('quests');return}
if(a.startsWith('milestone-')){claimVillageMilestone(a.slice(10));show('quests');return}
if(a==='toggletime'){S.visualTime=S.visualTime==='day'?'dusk':'day';persist();note('Ljusläge: '+(S.visualTime==='day'?'Dag':'Skymning'));return}
if(a==='appearance'){show('appearance');return}
if(a==='visual'){show('visual');return}
if(a==='openfishery'){show('fishery');return}
if(a==='fishtap'){fishingTap();return}
if(a==='fishcancel'){cancelFishing();return}
if(a==='castfish'){castFishingRod();if(panel==='fishery')show('fishery');return}
if(a==='weapons'){show('weapons');return}
if(a==='upgrades'){show('upgrades');return}
if(a==='gearcraft'){show('gearcraft');return}
if(a==='character'){show('character');return}
if(a==='crafthelmet'){craftEquipment('helmet');show('gearcraft');return}
if(a==='craftboots'){craftEquipment('boots');show('gearcraft');return}
if(a==='upgradeweapon'){upgradeEquipment('weapon');show('upgrades');return}
if(a==='upgradearmor'){upgradeEquipment('armor');show('upgrades');return}
if(a==='itemguide'){show('itemguide');return}
if(a==='loot'){show('loot');return}
if(a.startsWith('charm-')){equipCharm(a.slice(6));return}
if(a==='openbag'){show('bag');return}
if(a==='selectsword'){if(!S.heroSword){note('Smid och utrusta först ett svärd');return}S.weaponType='sword';persist();show('weapons');return}
if(a==='selectstaff'){if(!S.staffOwned){if(S.wood<5||S.runes<3){note('Behöver 5 trä och 3 runfragment');return}S.wood-=5;S.runes-=3;S.staffOwned=true}S.weaponType='staff';persist();show('weapons');return}
if(a==='bestiary'){show('bestiary');return}
if(a.startsWith('style')){S.heroStyle=Math.max(0,Math.min(2,Number(a.slice(5))||0));persist();show('appearance');return}
if(a==='openempire'){show('empire');return}
if(a==='openquests'){show('quests');return}
if(a==='opencontracts'){show('contracts');return}
if(a==='openhero'){show('hero');return}
if(a==='openexpeditions'){show('expeditions');return}
if(a==='leavehouse'){S.scene='village';S.x=500;S.y=550;hide();persist();note('Du lämnar byggnaden');return}
if(a==='fish'){catchFish(FISH_SPECIES[0],S.fisheryLevel);note('+'+S.fisheryLevel+' Sunperch')}
else if(a==='sellfish'){sellFishStocks()}
else if(a==='upfishery'){const cost=65*S.fisheryLevel;if(S.gold>=cost){S.gold-=cost;S.fisheryLevel++;note('Fiskeri nivå '+S.fisheryLevel)}else note('Inte tillräckligt med guld')}
else if(a==='hirefisher'){if(!S.fisheryManager&&S.gold>=180){S.gold-=180;S.fisheryManager=true;note('Fiskare anställd!')}else note('Kräver 180 guld')}
else if(a==='mine'){S.ore+=S.mine;S.oreGathered+=S.mine;note('+'+S.mine+' malm')}
else if(a==='wood'){S.wood+=S.woodLevel;note('+'+S.woodLevel+' trä')}
else if(a==='forge'){if(S.ore<2||S.wood<1)note('Behöver 2 malm och 1 trä');else{S.ore-=2;S.wood--;S.swords+=S.forge;S.swordsCrafted+=S.forge;S.forgeMastery++;if(S.forgeMastery%10===0)S.gold+=20;note('Svärd tillverkat!')}}
else if(a==='sell'){if(S.swords){S.swords--;const price=35+Math.floor(S.merchantRep/5)*5;S.gold+=price;S.totalGold+=price;note('+'+price+' guld')}else note('Inga svärd')}
else if(a==='upmine'&&pay(50*S.mine)){S.mine++;note('Gruvan uppgraderad!')}
else if(a==='upmine10'){const cost=Math.round(50*(10*S.mine+45)*.9);if(pay(cost)){S.mine+=10;note('Gruva +10 nivåer!')}}
else if(a==='upwood'&&pay(45*S.woodLevel)){S.woodLevel++;note('Skogsbruk uppgraderat!')}
else if(a==='upforge'&&pay(70*S.forge)){S.forge++;note('Smedjan uppgraderad!')}
else if(a==='manager'){if(S.manager)note('Gruvchef redan anställd');else if(pay(100)){S.manager=true;note('Gruvan automatiserad!')}}
else if(a==='autoforge'){if(S.autoForge)note('Redan automatiserad');else if(pay(150)){S.autoForge=true;note('Smedjan automatiserad!')}}

}else{c.guard=true;c.message='Du blockerar nästa attack.'}
if(c.hp<=0){
S.forestWins++;S.combatWins++;if(S.scene==='forest'&&c.enemyIndex===3){S.forestWolfDefeated=true;S.forestWolfWins++;S.wood+=6;S.runes+=2;}
if(S.scene==='dungeon'&&!c.training){S.dungeonKills=Math.min(3,S.dungeonKills+1);if(S.dungeonKills===3)S.dungeonRewardPending=true}
const loot=enemy.gold+S.level*3;

if(Math.random()<.4)S.runes++;
awardXP(enemy.xp);
S.combat=null;show('hero');note(enemy.name+' besegrad! +'+loot+' guld, +'+enemy.xp+' XP');persist();return
}
const hit=Math.max(1,enemy.attack+Math.floor(Math.random()*3)-(S.heroArmor?2:0)-(c.guard?5:0));
c.guard=false;S.hp=Math.max(0,S.hp-hit);c.message+=' '+enemy.name+' gör '+hit+' skada.';
if(a==='defend')c.skillReady=true;
if(S.hp<=0){
S.hp=Math.max(5,Math.floor((20+(S.level-1)*4)/2));S.combat=null;show('hero');note('Du besegrades men återhämtade dig i Emberfall');persist();return
}
}
else if(a==='fishcontract'){
 if(S.fish<5){note('Du behöver 5 fiskar');return}
 let remaining=5;const stocks=fishStocks();
 for(const f of FISH_SPECIES){const take=Math.min(remaining,stocks[f.id]||0);stocks[f.id]-=take;remaining-=take}
 const reward=marketReward(110);S.fish-=5;S.gold+=reward;S.totalGold+=reward;S.fishContractDone++;S.merchantRep++;S.marketDeliveries++;refreshMarket();note('Fiskekontrakt levererat! +'+reward+' guld');
}else if(a==='resourcecontract'){
 if(S.ore<10||S.wood<8){note('Behöver 10 malm och 8 trä');return}
 const reward=marketReward(160);S.ore-=10;S.wood-=8;S.gold+=reward;S.totalGold+=reward;S.resourceContractDone++;S.merchantRep++;S.marketDeliveries++;refreshMarket();note('Resurskontrakt levererat! +'+reward+' guld');
}else if(a==='contract'){if(S.swords<S.contractTarget){note('Du behöver '+S.contractTarget+' svärd');return}S.swords-=S.contractTarget;S.gold+=renownContractReward(S.contractReward);S.totalGold+=renownContractReward(S.contractReward);S.contractsDone++;S.merchantRep++;S.marketDeliveries++;refreshMarket();awardXP(12);S.contractTarget=Math.min(15,3+S.contractsDone);S.contractReward=100+S.contractsDone*45;note('Kontrakt levererat!')}else if(a==='expedition'){if(S.expeditionEnds){note('Expedition pågår redan');return}S.expeditionEnds=Date.now()+60000;note('Hjälten är ute på expedition!')}
else if(a==='expeditionupgrade'){if(pay(120)){S.expeditionTier=Math.min(5,S.expeditionTier+1);note('Expeditionsgille uppgraderat!')}}
else if(a==='claim'){if(!questDone()){note('Uppdraget är inte klart');return}S.quest++;S.gold+=50;S.totalGold+=50;awardXP(10);note('Uppdrag klart! +50 guld, +10 XP')}
else if(a==='joystick'){mode='joystick';note('Joystick vald')}
else if(a==='drag'){mode='drag';note('Dra på kartan vald')}
else if(a==='slow'){speed=120;note('Långsam')}
else if(a==='normal'){speed=170;note('Normal')}
else if(a==='fast'){speed=250;note('Snabb')}
if(panel)show(panel);
persist();
}

// iOS Safari: block document scrolling, allow scrolling only inside the open menu.
function menuScrollTarget(target){
  const modal=document.getElementById('modal');
  return modal.style.display==='block' && modal.contains(target);
}

  if(!menuScrollTarget(e.target) && e.cancelable)e.preventDefault();
},{capture:true,passive:false});

function syncViewport(){
  const v=window.visualViewport;
  const height=v ? v.height : window.innerHeight;
  document.documentElement.style.setProperty('--game-height',Math.round(height)+'px');
  document.body.style.top=(v ? v.offsetTop : 0)+'px';
  resize();
}
