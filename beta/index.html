const COOKING_RECIPES=[
 {id:'grilledfish',name:'Grillad fisk',needs:'2 fiskar',count:2,heal:8},
 {id:'fishstew',name:'Fiskgryta',needs:'4 fiskar och 2 trä',count:4,wood:2,heal:18}

function mealInventory(){
 if(!S.meals||typeof S.meals!=='object'||Array.isArray(S.meals))S.meals={};
 if(!S.mealMigration53){S.meals.legacy=(S.meals.legacy||0)+Math.max(0,Math.floor(S.cookedMeals||0));S.mealMigration53=true}
 S.cookedMeals=Object.values(S.meals).reduce((n,v)=>n+Math.max(0,Number(v)||0),0);return S.meals;
}
function cookMeal(id){
 const recipe=COOKING_RECIPES.find(r=>r.id===id);if(!recipe)return false;
 if(S.scene!=='interior'||S.houseType!=='market'){note('Köket finns i Handelsboden, sydväst i Emberfall.');return false}
 if(S.fish<recipe.count||S.wood<(recipe.wood||0)){note('Saknar ingredienser: '+recipe.needs);return false}
 const meals=mealInventory(),stocks=fishStocks();let n=recipe.count;
 for(const fish of FISH_SPECIES){const used=Math.min(n,stocks[fish.id]||0);stocks[fish.id]-=used;n-=used}
 S.fish-=recipe.count;S.wood-=recipe.wood||0;meals[id]=(meals[id]||0)+1;S.cookedMeals++;S.mealsCookedTotal++;S.mealIngredientsUsed+=recipe.count;
 persist();note(recipe.name+' färdig · återställer '+recipe.heal+' HP');return true;
}
function eatMeal(id='legacy'){
 const meals=mealInventory(),r=COOKING_RECIPES.find(r=>r.id===id),heal=r?.heal||(id==='legacy'?12:0);
 if(!heal||!(meals[id]>0)){note('Ingen sådan måltid i ryggsäcken');return false}
 const max=20+(S.level-1)*4;if(S.hp>=max){note('Du har redan fullt HP');return false}
 const actual=Math.min(heal,max-S.hp);meals[id]--;S.cookedMeals--;S.hp+=actual;persist();note('Måltid: +'+actual+' HP');return true;
}

 return '<div class="inventory-section"><h3>Mat i ryggsäcken</h3>'+[...COOKING_RECIPES,{id:'legacy',name:'Tidigare lagad måltid',heal:12}].filter(r=>meals[r.id]>0).map(r=>'<p>'+r.name+' · '+meals[r.id]+' st</p>'+btn('Ät · +'+r.heal+' HP','eat-'+r.id)).join('')+(S.cookedMeals?'':'<p>Inga måltider ännu. Laga din fångst i Handelsbodens kök.</p>')+'</div>';
}
function recipeButton(label,action,ready){return '<button type="button" '+(ready?'':'disabled')+' onclick="window.action(\''+action+'\')">'+label+'</button>'}
function cookingMenu(){
 const inKitchen=S.scene==='interior'&&S.houseType==='market';
 return '<h2>Kök & matlagning</h2><p class="game-hint">'+(inKitchen?'Välj ett recept. Maten hamnar i ryggsäcken och kan ätas inför nästa strid.':'Köket finns i Handelsboden, sydväst i Emberfall. Gå in och välj Kök.')+'</p>'+COOKING_RECIPES.map(r=>'<div class="inventory-section"><h3>'+r.name+'</h3><p>Fisk '+S.fish+'/'+r.count+(r.wood?' · Trä '+S.wood+'/'+r.wood:'')+'</p><p>Ger 1 '+r.name.toLowerCase()+' · +'+r.heal+' HP</p>'+recipeButton('Laga '+r.name,'cook-'+r.id,inKitchen&&S.fish>=r.count&&S.wood>=(r.wood||0))+'</div>').join('')+foodInventoryHTML()+btn('Till ryggsäcken','openbag');
}

function action(a){
if(a==='fishstart'){S.fishingGuideSeen=true;persist();castFishingRod();return}
if(a==='opencooking'){show('cooking');return}
if(a==='openhouse'){show('house');return}

if(a.startsWith('eat-')){eatMeal(a.slice(4));show(panel==='bag'?'bag':'cooking');return}
if(a.startsWith('cook-')){cookMeal(a.slice(5));show('cooking');return}
if(a==='guide'){show('guide');return}
if(a==='craftward'){craftWardSeal();show('production');return}
if(a==='deliverward'){deliverWardSeal();show('quests');return}
if(a==='deliverproductionquest'){deliverProductionQuest();show('quests');return}
if(a.startsWith('invcat-')){changeInventoryCategory(a.slice(7));return}
if(a==='reservesteelplus'){changeTradeReserve('steel',1);return}
if(a==='reservesteelminus'){changeTradeReserve('steel',-1);return}
if(a==='reserveruneplus'){changeTradeReserve('rune',1);return}
if(a==='reserveruneminus'){changeTradeReserve('rune',-1);return}
if(a.startsWith('priority-')){setProductionPriority(a.slice(9));return}
if(a==='autotradesteel'){toggleAutoTrade('steel');show('production');return}
if(a==='autotraderune'){toggleAutoTrade('rune');show('production');return}
if(a==='upwarehouse'){upgradeWarehouse();show('production');return}
if(a==='autosteel'){automateProduction('steel');show('production');return}
if(a==='autorune'){automateProduction('rune');show('production');return}
if(a==='craftsteel'){craftProduction('steel');show('production');return}
if(a==='craftrune'){craftProduction('rune');show('production');return}
if(a==='sellsteel'){sellProduction('steel');show('production');return}
if(a==='sellrune'){sellProduction('rune');show('production');return}
if(a==='openproduction'){show('production');return}
if(a.startsWith('empireorder-')){deliverEmpireOrder(a.slice(12));show('contracts');return}
if(a==='buildhall'){buildRenownHall();show('quests');return}
if(a==='buildcaravan'){buildAdvanced('caravan');show('quests');return}
if(a==='buildarcane'){buildAdvanced('arcane');show('quests');return}
if(a.startsWith('npcaccept-')){acceptNpcQuest(a.slice(10));show('quests');return}
if(a.startsWith('npccomplete-')){completeNpcQuest(a.slice(12));show('quests');return}
if(a.startsWith('npcclaim-')){claimNpcQuest(a.slice(9));show('quests');return}
if(a.startsWith('milestone-')){claimVillageMilestone(a.slice(10));show('quests');return}
if(a==='toggletime'){S.visualTime=S.visualTime==='day'?'dusk':'day';persist();note('Ljusläge: '+(S.visualTime==='day'?'Dag':'Skymning'));return}
if(a==='appearance'){show('appearance');return}
if(a==='visual'){show('visual');return}
if(a==='openfishery'){show('fishery');return}
if(a==='fishtap'){fishingTap();return}
if(a==='fishcancel'){cancelFishing();return}
if(a==='castfish'){castFishingRod();if(panel==='fishery')show('fishery');return}
if(a==='weapons'){show('weapons');return}
if(a==='upgrades'){show('upgrades');return}
if(a==='gearcraft'){show('gearcraft');return}
if(a==='character'){show('character');return}
if(a==='crafthelmet'){craftEquipment('helmet');show('gearcraft');return}
if(a==='craftboots'){craftEquipment('boots');show('gearcraft');return}
if(a==='upgradeweapon'){upgradeEquipment('weapon');show('upgrades');return}
if(a==='upgradearmor'){upgradeEquipment('armor');show('upgrades');return}
if(a==='itemguide'){show('itemguide');return}
if(a==='loot'){show('loot');return}
if(a.startsWith('charm-')){equipCharm(a.slice(6));return}
if(a==='openbag'){show('bag');return}
if(a==='selectsword'){if(!S.heroSword){note('Smid och utrusta först ett svärd');return}S.weaponType='sword';persist();show('weapons');return}
if(a==='selectstaff'){if(!S.staffOwned){if(S.wood<5||S.runes<3){note('Behöver 5 trä och 3 runfragment');return}S.wood-=5;S.runes-=3;S.staffOwned=true}S.weaponType='staff';persist();show('weapons');return}
if(a==='bestiary'){show('bestiary');return}
if(a.startsWith('style')){S.heroStyle=Math.max(0,Math.min(2,Number(a.slice(5))||0));persist();show('appearance');return}
if(a==='openempire'){show('empire');return}
if(a==='openquests'){show('quests');return}
if(a==='opencontracts'){show('contracts');return}
if(a==='openhero'){show('hero');return}
if(a==='openexpeditions'){show('expeditions');return}
if(a==='leavehouse'){leaveHouse();return}
if(a==='fish'){note('Fiskaren producerar automatiskt var femte sekund när den är anställd. Fiska själv vid stranden.');return}
else if(a==='sellfish'){sellFishStocks()}
else if(a==='upfishery'){const cost=65*S.fisheryLevel;if(S.gold>=cost){S.gold-=cost;S.fisheryLevel++;note('Fiskeri nivå '+S.fisheryLevel)}else note('Inte tillräckligt med guld')}
else if(a==='hirefisher'){if(!S.fisheryManager&&S.gold>=180){S.gold-=180;S.fisheryManager=true;note('Fiskare anställd!')}else note('Kräver 180 guld')}
else if(a==='mine'){S.ore+=S.mine;S.oreGathered+=S.mine;note('+'+S.mine+' malm')}
else if(a==='wood'){S.wood+=S.woodLevel;note('+'+S.woodLevel+' trä')}
else if(a==='forge'){if(S.ore<2||S.wood<1)note('Behöver 2 malm och 1 trä');else{makeSwords();S.forgeMastery++;if(S.forgeMastery%10===0)economyTransaction('quest',20,0,'forge-mastery');note('Svärd tillverkat!')}}
else if(a==='sell'){if(S.swords){const basis=consumeSwords(1),price=35+Math.floor(S.merchantRep/5)*5;economyTransaction('swords',price,basis,'sale');note('+'+price+' guld')}else note('Inga svärd')}
else if(a==='upmine'&&pay(50*S.mine)){S.mine++;note('Gruvan uppgraderad!')}
else if(a==='upmine10'){const cost=Math.round(50*(10*S.mine+45)*.9);if(pay(cost)){S.mine+=10;note('Gruva +10 nivåer!')}}
else if(a==='upwood'&&pay(45*S.woodLevel)){S.woodLevel++;note('Skogsbruk uppgraderat!')}
else if(a==='upforge'&&pay(70*S.forge)){S.forge++;note('Smedjan uppgraderad!')}
else if(a==='manager'){if(S.manager)note('Gruvchef redan anställd');else if(pay(100)){S.manager=true;note('Gruvan automatiserad!')}}
else if(a==='autoforge'){if(S.autoForge)note('Redan automatiserad');else if(pay(150)){S.autoForge=true;note('Smedjan automatiserad!')}}
else if(a==='autosell'){if(S.autoSell)note('Redan automatiserad');else if(pay(175)){S.autoSell=true;note('Marknaden automatiserad!')}}
else if(a==='equip'){if(S.heroSword)note('Svärd redan utrustat');else if(S.swords<1)note('Smid först ett svärd');else{consumeSwords(1);S.heroSword=true;note('Svärd utrustat!')}}
else if(a==='armor'){if(S.heroArmor)note('Rustning redan utrustad');else if(S.ore<5||S.wood<3)note('Behöver 5 malm och 3 trä');else{S.ore-=5;S.wood-=3;S.heroArmor=true;note('Rustning tillverkad!')}}
else if(a==='buypotion'){if(pay(25)){S.potions++;note('Potion köpt')}}
else if(a==='potion'){if(S.potions<1)note('Inga potions');else{S.potions--;S.hp=Math.min(20+(S.level-1)*4,S.hp+12);note('HP återställt')}}
else if(a==='startfight'){newCombat(0,true);return}
else if(a==='flee'){S.combat=null;show('hero');note('Du flydde från striden');persist();return}
else if(a==='attack'||a==='defend'||a==='runestrike'){
if(!S.combat)return;
const c=S.combat,enemy=ENEMIES[c.enemyIndex||0];
c.turn++;
if(a==='attack'){
const damage=Math.max(1,4+S.level+(S.heroSword?5:0)+Math.floor(Math.random()*4)-enemy.defense);
c.hp-=damage;c.message='Du gör '+damage+' skada.';
}else if(a==='runestrike'){
if(!c.skillReady){note('Rune Strike behöver vila en runda');return}
const damage=8+S.level*2+(S.heroSword?4:0);
c.hp-=damage;c.skillReady=false;c.message='Rune Strike! '+damage+' magisk skada.';
}else{c.guard=true;c.message='Du blockerar nästa attack.'}
if(c.hp<=0){
S.forestWins++;S.combatWins++;if(S.scene==='forest'&&c.enemyIndex===3){S.forestWolfDefeated=true;S.forestWolfWins++;S.wood+=6;S.runes+=2;}
if(S.scene==='dungeon'&&!c.training){S.dungeonKills=Math.min(3,S.dungeonKills+1);if(S.dungeonKills===3)S.dungeonRewardPending=true}
const loot=enemy.gold+S.level*3;
economyTransaction('adventure',loot,0,'combat');
if(Math.random()<.4)S.runes++;
awardXP(enemy.xp);
S.combat=null;show('hero');note(enemy.name+' besegrad! +'+loot+' guld, +'+enemy.xp+' XP');persist();return
}
const hit=Math.max(1,enemy.attack+Math.floor(Math.random()*3)-(S.heroArmor?2:0)-(c.guard?5:0));
c.guard=false;S.hp=Math.max(0,S.hp-hit);c.message+=' '+enemy.name+' gör '+hit+' skada.';
if(a==='defend')c.skillReady=true;
if(S.hp<=0){
S.hp=Math.max(5,Math.floor((20+(S.level-1)*4)/2));S.combat=null;show('hero');note('Du besegrades men återhämtade dig i Emberfall');persist();return
}
}
else if(a==='fishcontract'){
 if(S.fish<5){note('Du behöver 5 fiskar');return}
 let remaining=5;const stocks=fishStocks();
 for(const f of FISH_SPECIES){const take=Math.min(remaining,stocks[f.id]||0);stocks[f.id]-=take;remaining-=take}
 const reward=marketReward(110);S.fish-=5;economyTransaction('fish',reward,0,'contract');S.fishContractDone++;S.merchantRep++;S.marketDeliveries++;refreshMarket();note('Fiskekontrakt levererat! +'+reward+' guld');
}else if(a==='resourcecontract'){
 if(S.ore<10||S.wood<8){note('Behöver 10 malm och 8 trä');return}
 const reward=marketReward(160);S.ore-=10;S.wood-=8;economyTransaction('resources',reward,10*S.materialValuation.ore+8*S.materialValuation.wood,'contract');S.resourceContractDone++;S.merchantRep++;S.marketDeliveries++;refreshMarket();note('Resurskontrakt levererat! +'+reward+' guld');
}else if(a==='contract'){if(S.swords<S.contractTarget){note('Du behöver '+S.contractTarget+' svärd');return}const basis=consumeSwords(S.contractTarget);economyTransaction('swords',renownContractReward(S.contractReward),basis,'contract');S.contractsDone++;S.merchantRep++;S.marketDeliveries++;refreshMarket();awardXP(12);S.contractTarget=Math.min(15,3+S.contractsDone);S.contractReward=100+S.contractsDone*45;note('Kontrakt levererat!')}else if(a==='expedition'){if(S.expeditionEnds){note('Expedition pågår redan');return}S.expeditionEnds=Date.now()+60000;note('Hjälten är ute på expedition!')}
else if(a==='expeditionupgrade'){if(pay(120)){S.expeditionTier=Math.min(5,S.expeditionTier+1);note('Expeditionsgille uppgraderat!')}}
else if(a==='claim'){if(!questDone()){note('Uppdraget är inte klart');return}S.quest++;economyTransaction('quest',50,0,'story');awardXP(10);note('Uppdrag klart! +50 guld, +10 XP')}
else if(a==='joystick'){mode='joystick';note('Joystick vald')}
else if(a==='drag'){mode='drag';note('Dra på kartan vald')}
else if(a==='slow'){speed=120;note('Långsam')}
else if(a==='normal'){speed=170;note('Normal')}
else if(a==='fast'){speed=250;note('Snabb')}
if(panel)show(panel);
persist();
}
function interact(){
 const target=interactionTarget();if(!target)return;
 switch(target.kind){
 case 'fishing':fishingTap();break;
 case 'fish':castFishingRod();break;
 case 'npc':show(target.data);break;
 case 'house':show('house');break;
 case 'leave':leaveHouse();break;
 case 'building':S.houseType=({Smedja:'forge',Gruva:'mine',Marknad:'market',Gille:'guild'})[target.data.n];changeZone('interior',500,585,'Välkommen till '+target.data.n+' · '+({forge:'Smid och förbättra utrustning',mine:'Samla malm och utveckla gruvan',market:'Handla och laga mat',guild:'Uppdrag och expeditioner'})[S.houseType]);break;
 case 'forest':changeZone('forest',500,78,'Whisperwood');break;
 case 'dungeon':changeZone('dungeon',170,390,'Goblingrottan');break;
 case 'village':changeZone('village',S.scene==='forest'?500:885,S.scene==='forest'?765:425,'Tillbaka i Emberfall');break;
 case 'wood':S.wood+=3;S.forestWood+=3;persist();note('+3 trä · till smide eller matlagning');break;
 case 'forestChest':S.forestChest=true;economyTransaction('adventure',40,0,'forest-chest');S.wood+=10;S.runes++;persist();note('Förråd: +40 guld, +10 trä, +1 runfragment');break;
 case 'dungeonChest':dungeonInteract();break;
 }
 updateActionButton();
}

// iOS Safari: block document scrolling, allow scrolling only inside the open menu.
function menuScrollTarget(target){
  const modal=document.getElementById('modal');
  return modal.style.display==='block' && modal.contains(target);
}
document.addEventListener('touchmove',e=>{
  if(!menuScrollTarget(e.target) && e.cancelable)e.preventDefault();
},{capture:true,passive:false});
document.addEventListener('gesturestart',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
function syncViewport(){
  const v=window.visualViewport;
  const height=v ? v.height : window.innerHeight;
  document.documentElement.style.setProperty('--game-height',Math.round(height)+'px');
  document.body.style.top=(v ? v.offsetTop : 0)+'px';
  resize();
}
syncViewport();
window.addEventListener('resize',syncViewport);
if(window.visualViewport){
 window.visualViewport.addEventListener('resize',syncViewport);
 window.visualViewport.addEventListener('scroll',syncViewport);
}
